<!doctype html>
<meta charset="utf-8">
<title>ScreenLink Test Pattern</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  let frame = 0;
  let lastLog = performance.now(), lastFrame = 0;
  function draw(t) {
    frame++;
    if (t - lastLog >= 1000) {
      console.log(`test-pattern fps=${Math.round((frame - lastFrame) * 1000 / (t - lastLog))}`);
      lastLog = t; lastFrame = frame;
    }
    g.fillStyle = `hsl(${(t / 20) % 360} 60% 18%)`;
    g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 12; i++) {
      const x = (Math.sin(t / 700 + i) * 0.45 + 0.5) * c.width;
      const y = (Math.cos(t / 900 + i * 1.7) * 0.45 + 0.5) * c.height;
      g.fillStyle = `hsl(${i * 30} 80% 60%)`;
      g.beginPath(); g.arc(x, y, 60, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = '#fff';
    g.font = 'bold 96px Consolas, monospace';
    g.fillText(`frame ${frame}`, 60, 140);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  if (new URLSearchParams(location.search).get('silent') !== '1') {
    // 440 Hz left, 660 Hz right: easy to tell stereo survived the trip.
    const ctx = new AudioContext();
    const merger = ctx.createChannelMerger(2);
    [440, 660].forEach((hz, ch) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = hz;
      gain.gain.value = 0.15;
      osc.connect(gain).connect(merger, 0, ch);
      osc.start();
    });
    merger.connect(ctx.destination);
    ctx.resume();
  }
</script>
