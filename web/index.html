<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' wss://broker.hivemq.com:8884 wss://test.mosquitto.org:8081 wss://broker.emqx.io:8084">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="color-scheme" content="dark">
  <title>ScreenLink</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236b7cff'/%3E%3Crect x='5' y='6' width='14' height='9' rx='1.5' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='M9 18.5h6' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-leave" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></symbol>
  </svg>

  <!-- ===================== Join ===================== -->
  <main id="join-view" class="join">
    <header class="brand">
      <div class="logo" aria-hidden="true"><svg><use href="#i-screen"/></svg></div>
      <div>
        <h1>ScreenLink</h1>
        <p id="join-subtitle" class="sub">Watch a screen someone shares with you.</p>
      </div>
    </header>

    <section class="card">
      <div id="code-field">
        <label for="code" class="label">Invite code</label>
        <input id="code" class="code-input" placeholder="7K3M-QX9P" spellcheck="false" autocomplete="off" autocapitalize="characters" inputmode="text">
      </div>
      <button id="watch" class="btn primary">Watch</button>
      <p id="join-status" class="status" role="status"></p>
    </section>

    <p class="footnote">Phones can watch but not share: mobile browsers don't allow screen capture. To share, use the ScreenLink app on a computer.</p>
  </main>

  <!-- ===================== Watch ===================== -->
  <main id="watch-view" class="watch" hidden>
    <div id="stage" class="stage">
      <video id="video" playsinline autoplay></video>
      <div id="waiting" class="waiting">
        <div class="pulse" aria-hidden="true"></div>
        <p id="waiting-text">Connected. Waiting for them to share…</p>
      </div>
      <div class="top">
        <div id="label" class="chip" hidden><span class="live-dot"></span><span id="label-text"></span></div>
        <aside id="stats" class="stats" hidden></aside>
      </div>
      <button id="unmute" class="unmute" hidden><svg><use href="#i-muted"/></svg> Tap to unmute</button>
      <div id="banner" class="banner" hidden></div>
      <nav id="controls" class="controls">
        <button id="mute-btn" class="round" aria-label="Mute"><svg><use href="#i-volume"/></svg></button>
        <button id="stats-btn" class="round" aria-label="Stats"><svg><use href="#i-stats"/></svg></button>
        <button id="full-btn" class="round" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
        <button id="leave-btn" class="round danger" aria-label="Leave"><svg><use href="#i-leave"/></svg></button>
      </nav>
    </div>
  </main>
</body>
</html>
